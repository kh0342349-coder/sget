<!DOCTYPE html>
<!--
    pruebas/_transicion_probe.html
    -----------------------------------------------------------------------------
    Sonda de navegador para la transición entre módulos. Carga una página real
    del panel dentro de un iframe y comprueba, con eventos reales, que:
      · el contenido entra animado
      · un clic en un enlace interno dispara la salida y navega
      · las anclas y los enlaces externos NO se interceptan
      · la barra de progreso aparece durante la salida
    Solo se usa desde pruebas/transicion-visual.js.
-->
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda de transiciones</title></head>
<body>
<pre id="r">ejecutando…</pre>
<iframe id="f" src="../pruebas/_sesion_test.php?rol=1&amp;ir=Admin%2Frutas.php"
        style="width:1300px;height:820px;border:1px solid #ccc"></iframe>

<script>
const out = [];
let fallos = 0;
const f = document.getElementById('f');
function ok(c, t, d) { if (!c) fallos++; out.push((c ? 'OK   ' : 'FALLA') + ' | ' + t + (d ? ' | ' + d : '')); }
function info(t) { out.push('INFO  | ' + t); }
let terminado = false;
function fin() {
    if (terminado) return;      // el temporizador de seguridad no debe repetir el informe
    terminado = true;
    document.getElementById('r').textContent =
        'TRANS_PROBE_START\n' + out.join('\n') + '\nFALLOS=' + fallos + '\nTRANS_PROBE_END';
}

f.addEventListener('load', function () {
    setTimeout(function () {
        const d = f.contentDocument, w = f.contentWindow;
        if (!d || !d.getElementById('main-content-wrapper') && !d.querySelector('.sget-shell')) {
            ok(false, 'la página del panel cargó dentro del iframe',
               d ? 'sin .sget-shell' : 'sin document');
            return fin();
        }

        /* ---------- 1. El motor está cargado ---------- */
        ok(typeof w.SGETTransicion === 'object', 'SGETTransicion está cargado');
        ok(typeof w.SGETTransicion.salir === 'function', 'expone SGETTransicion.salir()');

        /* ---------- 2. Animación de entrada aplicada ---------- */
        const shell = d.querySelector('.sget-shell');
        const cs = w.getComputedStyle(shell);
        const nombreAnim = cs.animationName || '';
        const durAnim = cs.animationDuration || '0s';
        info('animationName=' + nombreAnim + ' duration=' + durAnim);
        ok(nombreAnim !== 'none' && nombreAnim !== '',
           'el contenido tiene animación de entrada aplicada',
           'animationName=' + nombreAnim);
        ok(durAnim !== '0s', 'la animación tiene duración distinta de 0', durAnim);

        /* Escalonado: los bloques de .sget-main no arrancan todos juntos */
        const hijos = d.querySelectorAll('.sget-main > *');
        const retardos = new Set();
        hijos.forEach(function (h) { retardos.add(w.getComputedStyle(h).animationDelay); });
        info('retardos=' + Array.from(retardos).join('|'));
        ok(retardos.size > 1, 'los bloques entran escalonados (no todos a la vez)',
           retardos.size + ' retardos distintos');

        /* ---------- 3. Barra de progreso presente ---------- */
        const barra = d.querySelector('.sget-barra-progreso');
        ok(!!barra, 'la barra de progreso está en el DOM');

        /* ---------- 4. Las anclas NO se animan ---------- */
        const ancora = d.createElement('a');
        ancora.href = '#seccion';
        ancora.id = 'ancla-test';
        ancora.textContent = 'ancla';
        d.body.appendChild(ancora);
        ancora.click();
        ok(!d.documentElement.classList.contains('sget-saliendo'),
           'un enlace a un ancla NO dispara la transición');

        /* ---------- 5. La API de salida funciona ---------- */
        const antes = d.documentElement.classList.contains('sget-saliendo');
        w.SGETTransicion.salir('about:blank');
        setTimeout(function () {
            ok(d.documentElement.classList.contains('sget-saliendo'),
               'SGETTransicion.salir() activa la clase de salida',
               'antes=' + antes);
            const b = d.querySelector('.sget-barra-progreso');
            ok(b && b.dataset.visible === '1', 'la barra de progreso se hace visible',
               b ? 'visible=' + b.dataset.visible : 'sin barra');
            fin();
        }, 120);
    }, 1000);
});

setTimeout(fin, 12000);
</script>
</body>
</html>
