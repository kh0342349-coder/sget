<!DOCTYPE html>
<!--
    pruebas/_cancelacion_probe.html
    -----------------------------------------------------------------------------
    Sonda de navegador del flujo de cancelación de viaje. Crea viajes de prueba
    por la API y comprueba el comportamiento real del modal.
    Solo se usa desde pruebas/cancelacion-visual.js.
-->
<html lang="es">
<head><meta charset="UTF-8"><title>Sonda de cancelación</title></head>
<body>
<pre id="r">ejecutando…</pre>
<iframe id="f" src="../pruebas/_sesion_test.php?rol=1&amp;ir=Admin%2Fviajes.php"
        style="width:1300px;height:860px;border:1px solid #ccc"></iframe>

<script>
const out = [];
let fallos = 0;
const f = document.getElementById('f');
function ok(c, t, d) { if (!c) fallos++; out.push((c ? 'OK   ' : 'FALLA') + ' | ' + t + (d ? ' | ' + d : '')); }
function info(t) { out.push('INFO  | ' + t); }
let terminado = false;
function fin() {
    if (terminado) return;
    terminado = true;
    document.getElementById('r').textContent =
        'CANCEL_PROBE_START\n' + out.join('\n') + '\nFALLOS=' + fallos + '\nCANCEL_PROBE_END';
}

f.addEventListener('load', function () {
    setTimeout(function () {
        const d = f.contentDocument, w = f.contentWindow;
        if (!d || !d.getElementById('modalCancelarViaje')) {
            ok(false, 'el modal de cancelación está en la página');
            return fin();
        }

        const modal  = d.getElementById('modalCancelarViaje');
        const form   = modal.querySelector('[data-sget-form]');
        const area   = modal.querySelector('[data-anotacion]');
        const motivo = modal.querySelector('[name="motivo"]');

        const visible = (nodo) => nodo && nodo.style.display !== 'none' && !nodo.hidden;
        const g = (n) => { const e = modal.querySelector('[data-sget-texto="' + n + '"]'); return e ? e.textContent.trim() : ''; };

        /* ---- Payload simulado: viaje de MAÑANA (anotación obligatoria) ---- */
        const manana = {
            id: 999, salida: '27/09/2026 07:00 AM', vence: '27/09/2026 09:45 AM',
            duracion: '2 h 45 min', ya_salio: 0, vencido: 0, pasajeros: 3,
            trayecto: 'Prueba (A → B)', conductor: 'Juan Pérez', placa: 'XYZ789',
        };
        // Se invoca EXACTAMENTE la misma acción que usa la página.
        // No se puede hacer click porque un botón creado después del
        // DOMContentLoaded no tiene el listener de sget-page.js.
        ok(typeof w.SGETAcciones === 'object' && typeof w.SGETAcciones.cancelarViaje === 'function',
           'sget-page.js expone SGETAcciones.cancelarViaje');
        const botonFalso = d.createElement('button');
        botonFalso.setAttribute('data-sget-dato', JSON.stringify(manana));
        d.body.appendChild(botonFalso);
        w.SGETAcciones.cancelarViaje(botonFalso);

        ok(modal.dataset.abierto === '1', 'el modal se abre', 'abierto=' + modal.dataset.abierto);
        ok(g('titulo').indexOf('999') > -1, 'el título incluye el id del viaje', g('titulo'));
        ok(g('trayecto') === manana.trayecto, 'el trayecto se rellena', g('trayecto'));
        ok(g('salida') === manana.salida, 'la salida se rellena', g('salida'));
        ok(g('vence') === manana.vence, 'el vencimiento se rellena', g('vence'));
        ok(g('duracion') === manana.duracion, 'la duración se rellena', g('duracion'));
        ok(g('conductor') === manana.conductor, 'el conductor se rellena', g('conductor'));
        ok(g('placa') === manana.placa, 'la placa se rellena', g('placa'));
        ok(g('pasajeros') === '3', 'el número de pasajeros se rellena', g('pasajeros'));
        ok(g('impacto').indexOf('notificados') > -1, 'el texto de impacto se rellena', g('impacto'));
        ok(g('etiquetaAnotacion').indexOf('obligatoria') > -1,
           'la anotación se marca OBLIGATORIA (el viaje aún no sale)', g('etiquetaAnotacion'));
        ok(form.dataset.sgetAnotacionObligatoria === '1',
           'el formulario exige anotación', form.dataset.sgetAnotacionObligatoria);
        ok(modal.querySelector('[name="id"]').value === '999', 'se envía el id correcto',
           modal.querySelector('[name="id"]').value);

        /* ---- Contador de caracteres ---- */
        const contador = modal.querySelector('[data-contador]');
        area.value = 'Hola';
        area.dispatchEvent(new w.Event('input', { bubbles: true }));
        ok(contador.textContent === '4/15', 'el contador refleja lo escrito', contador.textContent);
        ok(contador.dataset.ok === '0', 'el contador marca que falta texto', contador.dataset.ok);
        ok(area.classList.contains('sget-textarea--error'), 'el área se marca en rojo si es obligatoria');

        area.value = 'Esta es una anotación suficientemente larga para el sistema de transporte.';
        area.dispatchEvent(new w.Event('input', { bubbles: true }));
        ok(contador.dataset.ok === '1', 'el contador se pone en verde al llegar al mínimo', contador.dataset.ok);
        ok(!area.classList.contains('sget-textarea--error'), 'el área deja de marcarse en rojo');

        /* ---- El botón de re-CANCELAR limpia el área ---- */
        w.SGETAcciones.cancelarViaje(botonFalso);
        ok(area.value === '', 'al reabrir, la anotación se limpia', '"' + area.value + '"');
        ok(motivo.value === '', 'al reabrir, el motivo se reinicia', '"' + motivo.value + '"');

        /* ---- Envío bloqueado sin motivo ---- */
        const botonEnviar = form.querySelector('[type="submit"]');
        ok(!!botonEnviar && !botonEnviar.disabled, 'el botón de confirmar está disponible');
        form.dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
        setTimeout(function () {
            ok(modal.dataset.abierto === '1',
               'el envío sin motivo NO cierra el modal (sigue abierto para corregir)');

            /* ---- Viaje VENCIDO ---- */
            const vencido = {
                id: 1000, salida: '26/09/2026 05:00 AM', vence: '26/09/2026 07:00 AM',
                duracion: '2 h', ya_salio: 1, vencido: 1, pasajeros: 0,
                trayecto: 'Vencido (C → D)', conductor: 'Ana', placa: 'AAA111',
            };
            botonFalso.setAttribute('data-sget-dato', JSON.stringify(vencido));
            w.SGETAcciones.cancelarViaje(botonFalso);

            ok(/vencido/i.test(g('titulo')), 'un viaje vencido lo indica en el título', g('titulo'));
            ok(visible(modal.querySelector('[data-sget-mostrar="avisoVencido"]')),
               'se muestra el aviso de viaje vencido');
            ok(!visible(modal.querySelector('[data-sget-mostrar="zonaFormulario"]')),
               'se oculta el formulario de cancelación');
            ok(!visible(modal.querySelector('[data-sget-mostrar="botonCancelar"]')),
               'se oculta el botón "Cancelar y notificar"');
            ok(visible(modal.querySelector('[data-sget-mostrar="botonEntendido"]')),
               'se muestra el botón "Entendido"');
            ok(visible(modal.querySelector('[data-sget-mostrar="iconoVencido"]')),
               'se muestra el icono de hora vencida');
            ok(!visible(modal.querySelector('[data-sget-mostrar="iconoBan"]')),
               'se oculta el icono de prohibición');

            w.SGETModal.cerrar('modalCancelarViaje');
            setTimeout(fin, 200);
        }, 500);
    }, 1200);
});

setTimeout(fin, 15000);
</script>
</body>
</html>
